name: Build and test patches

on:
  push:
    branches:
      - x-lite
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon buildAndroid

      - name: Upload .mpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: piko-patches-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error

  test-twitter:
    name: Test patch Twitter 12.43.0-beta.01
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built .mpp
        uses: actions/download-artifact@v4
        with:
          name: piko-patches-mpp
          path: .

      - name: Show built bundles
        run: ls -la patches-*.mpp

      - name: Download morphe-desktop
        run: curl -fsSL -o morphe-desktop.jar https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar

      - name: Download Twitter source APK and selections
        run: |
          base=https://github.com/Capricornus007/repo/releases/download/morphe-apk-sources
          curl -fsSL -o twitter-src.apkm "$base/twitter-12.43.0-beta.01.apkm"
          curl -fsSL -o export.json "$base/morphe_all_selections.json"
          curl -fsSL -o apply_selections.py https://raw.githubusercontent.com/Capricornus007/repo/master/morphe/apply_selections.py

      - name: Create options from built .mpp and apply selections
        run: |
          MPP=$(ls patches-*.mpp | head -1)
          java -jar morphe-desktop.jar options-create -p "$MPP" -f com.twitter.android -o twitter-options.json
          python3 apply_selections.py export.json twitter-options.json com.twitter.android

      - name: Patch Twitter with built .mpp
        run: |
          MPP=$(ls patches-*.mpp | head -1)
          java -jar morphe-desktop.jar patch \
            -p "$MPP" \
            --options-file twitter-options.json \
            --force \
            --continue-on-error \
            -r patch-result.json \
            -o twitter-patched.apk \
            twitter-src.apkm

      - name: Summarize patch results
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          with open('patch-result.json') as f:
              r = json.load(f)
          applied = r.get('appliedPatches', [])
          failed = r.get('failedPatches', [])
          print(f"success={r.get('success')} applied={len(applied)} failed={len(failed)}")
          for x in failed:
              err = str(x.get('error', '')).splitlines()
              print(f"FAIL {x.get('name')}: {err[0] if err else ''}")
              for line in err[1:4]:
                  print(f"  {line}")
          EOF

      - name: Upload patched APK and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitter-test-patched
          path: |
            twitter-patched.apk
            patch-result.json
          if-no-files-found: warn
