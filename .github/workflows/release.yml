name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # backmerge 插件的 git rebase 需要完整歷史；淺檢出（預設 depth=1）
          # 會讓 success 步驟的 rebase origin/main 失敗（run 45710367602 實錘，
          # 發布本身已成功、僅 dev 同步炸）。
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 2026-11-26：棄用 cycjimmy/semantic-release-action@v8——它自帶的舊版
        # conventional-changelog-writer 會遮住 repo 的 v10 preset 需求
        # （「Missing helper: requires conventional-changelog-writer@9 or newer」，
        # run 45705858041/45706492895 實錘，npm overrides 也救不了：舊 writer
        # 在 action 自己的安裝目錄裡）。repo 的 package.json 已含全套
        # semantic-release 26 + 插件 + vendor shim，直接 npx 原地跑。
        run: |
          npx --no-install semantic-release
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "new_release_published=$([ -n "$TAG" ] && echo true || echo false)"
            echo "new_release_git_tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Piko Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp